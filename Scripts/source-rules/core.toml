# Rules over Packages/Core sources.

[[rule]]
id = "only-the-bridge-iterates-an-observation"
why = """\
`ObservationBridge` retries a failed GRDB observation with backoff. A store that hand-rolls \
`for try await value in observation.values(…)` ends its stream for good on one transient SQLite \
error. Use `ObservationBridge.stream`."""
files = ["Packages/Core/Sources/**/*.swift", "App/Whirr/**/*.swift"]
forbid = 'observation\.values\('
allow = ["Packages/Core/Sources/Persistence/ObservationBridge.swift"]
example = 'for try await value in observation.values(in: reader) { yield(value) }'

# MARK: - Process globals and waiting in tests

[[rule]]
id = "tests-never-touch-a-process-global"
why = """\
AVAudioSession, Now Playing metadata, remote commands, `URLCache` and `UserDefaults` are \
process-wide, and a real one damages later cases in the same process. Use the shims in \
`App/WhirrTests/Fakes/` for the audio session, Now Playing and remote commands; a zero-capacity \
`URLCache` instance; and `UserDefaults(suiteName:)` with a name unique to the case."""
files = [
  "Packages/Core/Tests/**/*.swift",
  "App/WhirrTests/**/*.swift",
  "App/WhirrPerformanceTests/**/*.swift",
]
text = "code-no-strings"
forbid = 'AVAudioSession\.sharedInstance\(\)|MPNowPlayingInfoCenter\.default\(\)|MPRemoteCommandCenter\.shared\(\)|URLCache\.shared\b|UserDefaults\.standard\b'
example = 'let session = AVAudioSession.sharedInstance()'
ok = ['let defaults = UserDefaults(suiteName: "case")', 'let note = "UserDefaults.standard"']

[[rule]]
id = "tests-never-swallow-sleep-cancellation"
why = """\
`try? await Task.sleep` discards the only error `Task.sleep` throws, cancellation, and turns the \
rest of a wait into a spin no `.timeLimit` can interrupt (one instance spun 600,050 times in \
1.16 s). Let it throw, or wait through `awaitCondition`/`awaitQuiescence`."""
files = [
  "Packages/Core/Tests/**/*.swift",
  "App/WhirrTests/**/*.swift",
  "App/WhirrPerformanceTests/**/*.swift",
  "Scripts/watch-regressions/**/*.swift",
]
text = "code-no-strings"
forbid = 'try\? await Task\.sleep'
example = 'try? await Task.sleep(for: .milliseconds(1))'
ok = ['try await Task.sleep(for: .seconds(60))']

[[rule]]
id = "tests-never-block-on-a-semaphore"
why = """\
`DispatchSemaphore` blocks a cooperative-pool thread, which in a test is a deadlock waiting for a \
busy pool. Use an async fixture. The one allowance is the test that pins GRDB's cross-connection \
busy-lock contract: it must observe a writer blocked at the SQLite level, its writers are detached \
threads, and every `wait` there carries a timeout."""
files = [
  "Packages/Core/Tests/**/*.swift",
  "App/WhirrTests/**/*.swift",
  "App/WhirrPerformanceTests/**/*.swift",
  "Scripts/watch-regressions/**/*.swift",
]
text = "code-no-strings"
forbid = 'DispatchSemaphore'
allow = ["Packages/Core/Tests/PersistenceTests/AppDatabaseTests.swift"]
example = 'let gate = DispatchSemaphore(value: 0)'

[[rule]]
id = "tests-never-assert-wall-clock-time"
why = """\
A duration measured inside a parallel run reports the machine's load as much as the code. Assert \
on behaviour; put a benchmark behind an environment variable and allow it here. The smart-list \
benchmark runs only with `WHIRR_BENCHMARKS=1`, alone, on a quiet machine."""
files = [
  "Packages/Core/Tests/**/*.swift",
  "App/WhirrTests/**/*.swift",
  "App/WhirrPerformanceTests/**/*.swift",
  "Scripts/watch-regressions/**/*.swift",
]
text = "code-no-strings"
forbid = 'ContinuousClock\(\)|SuspendingClock\(\)|\.measure \{'
allow = ["Packages/Core/Tests/PersistenceTests/SmartListEpisodesReadingBenchmarkTests.swift"]
example = 'let elapsed = await clock.measure { await work() }'

[[rule]]
id = "tests-animate-only-with-a-sped-up-window"
why = """\
A UIKit presentation, push or scroll animated in real time holds the process-wide key window for \
the whole animation, and every hosted-window suite queues behind it. A file that animates must \
speed its window's layer (`scope.window.layer.speed`) and wait on states, not delays. The rule is \
per file, so a violation is reported at line 1: search the file for `animated: true`."""
files = [
  "Packages/Core/Tests/**/*.swift",
  "App/WhirrTests/**/*.swift",
  "App/WhirrPerformanceTests/**/*.swift",
  "Scripts/watch-regressions/**/*.swift",
]
text = "code-no-strings"
forbid = '\A(?![\s\S]*layer\.speed)[\s\S]*?^(?=[^\n]*animated: true)[^\n]*?(?:\.present\(|\.dismiss\(|pushViewController\(|popViewController\(|setViewControllers\(|setContentOffset\(|scrollToItem\(|scrollToRow\(|scrollRectToVisible\()'
example = 'presenter.present(page, animated: true)'
ok = [
  "scope.window.layer.speed = 5\npresenter.present(page, animated: true)",
  'let step = Step.move(to: -168, animated: true)',
]

# A fixed `Task.sleep` before an assertion guesses how long the work takes. The sites below predate
# the rule: the ratchet rules cap each file at its count, so none may be added. When a file drops
# below its cap, lower its cap (or move it to the strict rule once it reaches zero).
[[rule]]
id = "tests-never-add-a-fixed-sleep"
why = """\
A fixed `Task.sleep` guesses how long the work takes: too short flakes, long enough costs every \
run. Wait for the state with `awaitCondition`, or for nothing to happen with `awaitQuiescence`. A \
fake that hangs until cancelled can say so on one line: \
`do { try await Task.sleep(for: .seconds(60)) } catch {}`. The files in the ratchet rules below \
keep their existing counts."""
files = [
  "Packages/Core/Tests/**/*.swift",
  "App/WhirrTests/**/*.swift",
  "App/WhirrPerformanceTests/**/*.swift",
  "Scripts/watch-regressions/**/*.swift",
]
exclude = [
  "App/WhirrPerformanceTests/NowPlayingSwitchMemoryTests.swift",
  "App/WhirrTests/CoverPaletteSurfaceTests.swift",
  "App/WhirrTests/EndpointSwitchCompositionTests.swift",
  "App/WhirrTests/EndpointSwitchTriggersTests.swift",
  "App/WhirrTests/LibraryShellPresentationTests.swift",
  "App/WhirrTests/PathUpdateLatchTests.swift",
  "App/WhirrTests/PlayerMorphTransitionTests.swift",
  "App/WhirrTests/WatchCataloguePublisherTests.swift",
  "Packages/Core/Tests/AppModelTests/PlaybackTrimModelTests.swift",
  "Packages/Core/Tests/AppModelTests/PodcastShowSettingsModelTests.swift",
  "Packages/Core/Tests/AppModelTests/ProblemReportModelTests.swift",
  "Packages/Core/Tests/AppModelTests/RSSEpisodeChapterResolverTests.swift",
  "Packages/Core/Tests/AppModelTests/RSSFeedRefreshCoordinatorTests.swift",
  "Packages/Core/Tests/TestSupportTests/OnDiskDatabaseGateTests.swift",
  "Packages/Core/Tests/TestSupportTests/WaitUntilTests.swift",
]
text = "code-no-strings"
forbid = '^(?![^\n]*(?:catch|while true))[^\n]*try await Task\.sleep\('
example = 'try await Task.sleep(for: .milliseconds(300))'
ok = [
  'do { try await Task.sleep(for: .seconds(60)) } catch {}',
  'while true { try await Task.sleep(for: .seconds(1)) }',
]

[[rule]]
id = "tests-fixed-sleep-ratchet-one"
why = """\
These files hold one fixed `Task.sleep` that predates `tests-never-add-a-fixed-sleep`. Do not add \
another; if you remove it, delete the file from this list so the strict rule covers it."""
files = [
  "App/WhirrPerformanceTests/NowPlayingSwitchMemoryTests.swift",
  "App/WhirrTests/CoverPaletteSurfaceTests.swift",
  "App/WhirrTests/LibraryShellPresentationTests.swift",
  "App/WhirrTests/PathUpdateLatchTests.swift",
  "Packages/Core/Tests/AppModelTests/PlaybackTrimModelTests.swift",
  "Packages/Core/Tests/AppModelTests/PodcastShowSettingsModelTests.swift",
  "Packages/Core/Tests/AppModelTests/ProblemReportModelTests.swift",
  "Packages/Core/Tests/AppModelTests/RSSEpisodeChapterResolverTests.swift",
  "Packages/Core/Tests/AppModelTests/RSSFeedRefreshCoordinatorTests.swift",
  "Packages/Core/Tests/TestSupportTests/WaitUntilTests.swift",
]
at_most = 1
text = "code-no-strings"
forbid = '^(?![^\n]*(?:catch|while true))[^\n]*try await Task\.sleep\('
example = 'try await Task.sleep(for: .milliseconds(300))'

