# MARK: - Persistence and transport boundaries

[[rule]]
id = "rss-episode-state-has-one-production-writer"
why = """\
A SQLite trigger would fire for every writer; a Swift funnel only catches writers going through \
`RSSEpisodeStateStore`. A second production writer of `rssEpisodeState` would commit local state \
that resolves no Saved intent and, once the cloud resolver is attached, sends nothing. Route the \
write through `RSSEpisodeStateStore`, or extend the store. `Schema/` owns the table's DDL and \
backfill. Constructing the row is the tell: a writer must build one to persist it."""
files = ["Packages/Core/Sources/**/*.swift", "App/Whirr/**/*.swift"]
exclude = ["Packages/Core/Sources/Persistence/Schema/**"]
forbid = 'RSSEpisodeStateRecord\(|(?i:(?:insert into|update|delete from)\s+rssEpisodeState)'
allow = ["Packages/Core/Sources/Persistence/RSSEpisodeStateStore.swift"]
example = 'let row = RSSEpisodeStateRecord(accountId: 1, episodeId: 2)'

[[rule]]
id = "resolution-center-uses-async-persistence"
why = """\
Resolution actions run in async contexts, where a blocking DAO or store call holds a cooperative \
thread while it waits for a database connection. Call the `…Async` twin of every DAO or store \
method on `accountDAO`, `mediaProgressDAO`, `itemDAO`, `outboxStore` and `sessionStore`."""
files = ["Packages/Core/Sources/SyncEngine/ResolutionCenter.swift"]
forbid = '\b(?:accountDAO|mediaProgressDAO|itemDAO|outboxStore|sessionStore)\.(?!\w*Async\()\w+\('
example = 'let account = try accountDAO.fetch()'
ok = ['let account = try await accountDAO.fetchAsync()']

[[rule]]
id = "outbox-drainer-acknowledges-asynchronously"
why = """\
The drainer acknowledges an operation from an async context, where a blocking store call holds a \
cooperative thread while it waits for a database connection. Use the `…Async` twins for \
acknowledgement. (`fetchSession(` is still called blocking in `OutboxDrainer+PlaybackSession.swift`, \
so it is not covered here.)"""
files = ["Packages/Core/Sources/SyncEngine/OutboxDrainer*.swift"]
forbid = '\b(?:sessionStore\.(?:acknowledgeSync|acknowledgeClose)|outboxStore\.acknowledge)\('
example = 'try sessionStore.acknowledgeSync(operationId: id, sessionId: session)'
ok = ['try await outboxStore.acknowledgeAsync(operationId: id) { _ in }']

[[rule]]
id = "only-the-oidc-endpoint-surfaces-redirects-and-cookies"
why = """\
Only the two OIDC legs may surface a redirect and its cookies, which are session secrets. The \
opt-in is internal to ABSApi, but internal reaches every ABSApi file, so this rule is what keeps \
another endpoint from quietly taking it."""
files = ["Packages/Core/Sources/**/*.swift", "App/Whirr/**/*.swift"]
forbid = '\.surfacingRedirectAndCookies\(\)|\.replacingCookieHeader\('
allow = ["Packages/Core/Sources/ABSApi/OIDCLoginEndpoint.swift"]
example = 'request = request.surfacingRedirectAndCookies()'

# MARK: - Release audit

[[rule]]
id = "no-pasted-token-literal-in-source"
why = """\
A pasted credential ships in the repository history. This matches a whole JWT, or `Bearer` \
followed by enough literal characters to be a credential rather than an interpolation \
(`Bearer \\(token)` is fine). The rule files themselves are excluded: their examples are tokens."""
files = ["**/*.{swift,plist,pbxproj,yaml,yml,sh,md,xcconfig,toml,ini,conf,json,xml}"]
exclude = ["Scripts/source-rules/*.toml"]
text = "raw"
forbid = '(?i:\bBearer\s+[A-Za-z0-9._~+/=-]{24,}\b)|\beyJ[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}\b'
example = [
  'h["Authorization"] = "Bearer sk-9f3b2c8d4e7a1650fbc93de2aa"',
  'let t = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.dBjftJeZ4CVPmB92K27uhbUJU1p1r"',
]
ok = [
  'h["Authorization"] = "Bearer \\(accessToken)"',
  'h["Authorization"] = "Bearer header-secret"',
]

[[rule]]
id = "no-token-shaped-value-in-fixtures"
why = """\
A fixture or property list holding a real-looking credential leaks it into the repository. Use \
`<redacted>`, `redacted`, `fixture`, `placeholder` or `changeme`."""
files = [
  "Packages/Core/Sources/TestSupport/Fixtures/**/*.{csv,json,plist,schema,txt,xml}",
  "**/*.plist",
]
text = "raw"
forbid = '(?i:"(?:access[_-]?token|refresh[_-]?token|token|api[_-]?key|secret|password|authorization|credential)"\s*:\s*"(?!(?:<redacted>|redacted|fixture|placeholder|changeme)")[^"]+")|(?i:\bBearer\s+[A-Za-z0-9._~+/=-]{24,}\b)|\beyJ[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}\b'
example = '{"accessToken":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}'
ok = ['{"accessToken":"<redacted>","refreshToken":"<redacted>"}']

[[rule]]
id = "no-analytics-tracking-or-crash-framework-import"
why = """\
Whirr ships no analytics, tracking or third-party crash reporting (docs/SECURITY.md). A module \
whose name carries one of these fragments is refused wherever it is imported; MetricKit and OSLog \
are system diagnostics and fine."""
files = ["App/Whirr/**/*.swift", "Packages/Core/Sources/**/*.swift", "Packages/Core/Package.swift"]
forbid = '(?i:^[ \t]*(?:@testable[ \t]+)?import[ \t]+\w*?(?:adjust|amplitude|analytics|appsflyer|bugsnag|crashlytics|crashreporter|datadog|firebase|fullstory|heap|mixpanel|newrelic|posthog|rollbar|segment|sentry|telemetry|tracking))'
example = 'import Sentry'
ok = ['import MetricKit', 'import OSLog']

[[rule]]
id = "no-analytics-tracking-or-crash-framework-linked"
why = """\
Whirr ships no analytics, tracking or third-party crash reporting (docs/SECURITY.md). The Xcode \
project may not link a framework or name a product whose name carries one of these fragments."""
files = ["App/Whirr.xcodeproj/project.pbxproj"]
text = "raw"
forbid = '(?i:/\*[^\n]*?(?:adjust|amplitude|analytics|appsflyer|bugsnag|crashlytics|crashreporter|datadog|firebase|fullstory|heap|mixpanel|newrelic|posthog|rollbar|segment|sentry|telemetry|tracking)[^\n]*? in Frameworks \*/|productName = [^\n]*(?:adjust|amplitude|analytics|appsflyer|bugsnag|crashlytics|crashreporter|datadog|firebase|fullstory|heap|mixpanel|newrelic|posthog|rollbar|segment|sentry|telemetry|tracking))'
example = [
  '/* Sentry in Frameworks */',
  'productName = FirebaseAnalytics;',
]
ok = ['/* GRDB in Frameworks */', 'productName = Whirr;']

[[rule]]
id = "no-analytics-tracking-or-crash-framework-resolved"
why = """\
Whirr ships no analytics, tracking or third-party crash reporting (docs/SECURITY.md). A resolved \
package whose identity or location carries one of these fragments is refused."""
files = [
  "Packages/Core/Package.resolved",
  "App/Whirr.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved",
]
text = "raw"
forbid = '(?i:"(?:identity|location)"\s*:\s*"[^"\n]*(?:adjust|amplitude|analytics|appsflyer|bugsnag|crashlytics|crashreporter|datadog|firebase|fullstory|heap|mixpanel|newrelic|posthog|rollbar|segment|sentry|telemetry|tracking))'
example = '"location" : "https://github.com/getsentry/sentry-cocoa.git",'
ok = ['"location" : "https://github.com/groue/GRDB.swift.git",']

[[rule]]
id = "widget-extension-uses-no-privacy-manifest-api"
why = """\
The widget extension's privacy manifest declares no required-reason API, tracking or data \
collection. Code it compiles (including the Siri playback intents) must not reach one: if it \
needs `UserDefaults`, `systemUptime`, file timestamps or disk-space reads, declare the reason in \
`App/WhirrWidgets/PrivacyInfo.xcprivacy` first."""
files = [
  "App/WhirrWidgets/**/*.swift",
  "Packages/Core/Sources/WidgetProtocol/**/*.swift",
  "App/Whirr/Playback/SiriPlaybackIntents.swift",
]
forbid = 'UserDefaults|systemUptime|attributesOfItem|ModificationDate|volumeAvailableCapacity'
example = 'let value = UserDefaults.standard.integer(forKey: "k")'

[[rule]]
id = "watch-app-uses-no-undeclared-privacy-api"
why = """\
The Watch app's privacy manifest declares boot time, file timestamps and `UserDefaults` only. \
Disk-space and active-input-mode reads are undeclared: declare the reason in \
`App/WhirrWatch Watch App/PrivacyInfo.xcprivacy` before code the Watch app compiles or links \
reaches them."""
files = [
  "App/WhirrWatch Watch App/**/*.swift",
  "App/WatchShared/**/*.swift",
  "Packages/Core/Sources/WatchPlayback/**/*.swift",
  "Packages/Core/Sources/PlayerCore/**/*.swift",
]
forbid = 'volumeAvailableCapacity|systemFreeSize|activeInputModes'
example = 'let free = try url.resourceValues(forKeys: [.volumeAvailableCapacityKey])'
